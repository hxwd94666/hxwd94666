name: Refresh profile stats
on:
  workflow_dispatch:
    inputs:
      force:
        description: Refresh all modules, including those already fresh today
        type: boolean
        default: true
  schedule:
    # UTC 01/07/13/19:19 = Asia/Shanghai 09/15/21 and next-day 03:19.
    # Skip only when every module is fresh; failed modules retry six hours later.
    - cron: '19 1,7,13,19 * * *'
permissions:
  contents: write
concurrency:
  group: profile-stats
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check module freshness
        id: check
        run: |
          args=()
          if [ "$FORCE_REFRESH" = true ]; then args+=(--force); fi
          if python3 -B scripts/check_fresh_today.py "${args[@]}"; then
            echo "need_refresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "need_refresh=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run offline regression tests
        if: steps.check.outputs.need_refresh == 'true'
        run: |
          python3 -B -m unittest discover -s tests -p "test_refresh.py" -v
          python3 -B -m unittest discover -s tests -p "test_profile.py" -k "render" -v
      - name: Generate public-data cards
        if: steps.check.outputs.need_refresh == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=()
          if [ "$FORCE_REFRESH" = true ]; then args+=(--force); fi
          python3 -B scripts/update_stats.py "${args[@]}"
      - name: Commit generated cards
        if: steps.check.outputs.need_refresh == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data/stats.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh profile stats"
          git push
