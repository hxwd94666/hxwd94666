name: Refresh profile stats
on:
  workflow_dispatch:
  schedule:
    - cron: '19 1 * * *'
permissions:
  contents: write
concurrency:
  group: profile-stats
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run offline regression tests
        run: python3 -B -m unittest discover -s tests -v
      - name: Generate public-data cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B scripts/update_stats.py
      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data/stats.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh profile stats"
          git push
